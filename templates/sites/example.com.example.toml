# =====================================================================
#  Site Recipe — example.com
# ---------------------------------------------------------------------
#  Derived from the fujin_metaverse exploration (Phase 7 design notes).
#  This file is committed as a *sample* — install into
#      ~/.rev_scraping/sites/example.com.toml
#  to make it active. Schema: see templates/sites/example.com.toml.
# =====================================================================

schema_version = 1

[site]
domain         = "example.com"
last_verified  = "2026-05-12T00:00:00Z"
rendering      = "spa"
framework      = "nuxt"
backend_hint   = "node-api"
tags           = ["paywall", "article", "creator-economy", "japanese"]

[api]
base_url                  = "https://api.example.com"
public_auth_required      = false
auth_method               = "none"
auth_secret_ref           = ""
rate_limit_recommendation = { rps = 1.5, burst = 3 }
response_encoding         = "json"

# ---- endpoints ----

[[api.endpoints]]
purpose         = "user_profile"
path            = "/v2/users/{username}"
url_pattern     = "https://api.example.com/v2/users/{username}"
http_method     = "GET"
required_headers = { accept = "application/json" }
response_shape  = { root = "/" }
discovered_via  = "network-capture"
last_verified   = "2026-05-12T00:00:00Z"
avg_latency_ms  = 220
ok_status       = [200]

[[api.endpoints]]
purpose         = "user_articles"
path            = "/v2/users/{username}/articles"
url_pattern     = "https://api.example.com/v2/users/{username}/articles"
http_method     = "GET"
required_headers = { accept = "application/json" }
required_query  = []
response_shape  = { root = "/", item = "/articles", paging = "/meta" }
discovered_via  = "network-capture"
last_verified   = "2026-05-12T00:00:00Z"
avg_latency_ms  = 260

[[api.endpoints]]
purpose         = "article"
path            = "/v2/articles/{article_id}"
url_pattern     = "https://api.example.com/v2/articles/{article_id}"
http_method     = "GET"
required_headers = { accept = "application/json" }
response_shape  = { root = "/" }
discovered_via  = "network-capture"
last_verified   = "2026-05-12T00:00:00Z"
avg_latency_ms  = 240

[scraping_strategy]
preferred_method = "api"
fallback_method  = "obscura"
paywall_fields   = ["body"]
public_fields = [
  "title",
  "intro_body",
  "price",
  "sales_histories_count",
  "review_average",
  "review_count",
  "published_at",
  "author_username",
  "category",
  "tags",
]
follow_internal_links = false
max_depth             = 1

[rate_limits]
concurrent          = 2
delay_ms            = 600
jitter_ms           = 300
respect_retry_after = true

# Selectors only matter on the HTML fallback path. The Nuxt page renders
# the same payload that the API returns, so prefer API.
[selectors]
title       = { css = "h1",                              stable_id = "bm_title_v1" }
intro_body  = { css = "section.intro",                   stable_id = "bm_intro_v1" }
price       = { css = "span[data-test='price']",         stable_id = "bm_price_v1" }
author      = { css = "a[href^='/users/']",              stable_id = "bm_author_v1" }
published_at = { css = "time[datetime]", attr = "datetime", stable_id = "bm_date_v1" }

[fingerprint]
mobile_preset       = "ios_safari_17"
sec_ch_ua_required  = false
referer_policy      = "strict-origin-when-cross-origin"
accept_language     = "ja,en-US;q=0.9,en;q=0.8"

[anti_bot]
cloudflare      = true
turnstile       = false
datadome        = false
recaptcha       = false
akamai          = false
bypass_strategy = "obscura"

[notes]
text = """
Discovered during fujin_metaverse user-articles ingest.

Key findings:
- Nuxt SPA. Initial HTML contains a minimal shell; data hydrates from
  /v2/* JSON endpoints. SSR payload is also embedded in
  <script id="__NUXT_DATA__"> but is identical to the API response.
- The `body` field is paywalled. Calling GET /v2/articles/{id} without
  a session returns the article object with `body` replaced by a short
  teaser (~200 chars) or omitted entirely. `intro_body` is always public.
- No auth required for listing / metadata.
- Cloudflare is fronting the API but allows clean residential IPs with a
  realistic UA. obscura fallback is sufficient when 403 is observed.
- Pagination on /v2/users/{username}/articles is offset-based; check the
  `meta` object once during refresh and re-verify when schema drifts.
- Rate limit: empirically 429 above ~3 rps. Keep concurrent <= 2.
"""
