name: Release

# Lane H (v1.3) — one-tag release pipeline:
#   - cargo package + publish dry-run (gates manifest correctness)
#   - matrix build for Linux x86_64 + Linux aarch64 + macOS x86_64 + macOS arm64
#   - deb + rpm artifacts (Linux only)
#   - distroless multi-arch OCI image (amd64+arm64) -> ghcr.io
#   - cosign sign-blob for every binary archive (keyless OIDC)
#   - SLSA L3 build-provenance attestation via actions/attest-build-provenance
#   - trivy image scan (HIGH,CRITICAL fail)
#   - GitHub release (draft) populated with all artifacts + signatures
#   - release-please PR automation in a separate job (pre-tag)
#
# Security note: every `run:` step uses only trusted scalars (runner-set env
# like GITHUB_REF_NAME, step outputs, secrets). No user-controlled github.event
# fields are interpolated into shell commands.
#
# External gates (brew install / docker pull / cosign verify / crates.io
# publish) run on real tag push only; PR-level CI exercises dry-run paths.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile.distroless'
      - 'Formula/rev-stealth.rb'
      - 'install.sh'
      - 'crates/stealth-cli/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Execute the full release pipeline in dry-run mode (no crates.io publish, no GHCR push, no GitHub release). Artifacts and signatures stay local to the run.'
        type: boolean
        default: false

# Top-level permissions are read-only. Jobs that need OIDC/contents-write
# opt in per-job. After Slice B-1 round-3, OIDC authority (`id-token:
# write` + `attestations: write`) is held ONLY by the push-only
# `sign-binaries` and `sign-image` jobs — `build-binaries` and
# `oci-image` are deliberately OIDC-less so PR / workflow_dispatch
# dry-run runs cannot mint a Sigstore JWT or write GitHub attestation
# records. `gh-release` retains `contents: write` for draft creation
# (push-only step).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rev-stealth

jobs:
  preflight:
    name: preflight (lint + cargo dry-run)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: actionlint (workflow syntax)
        uses: raven-actions/actionlint@v2
      - name: shellcheck install.sh
        run: shellcheck -s sh install.sh
      # NOTE: workspace-wide `cargo package` fails because internal path
      # deps (e.g. mobile-fp) intentionally have no version requirement —
      # they're `publish = false`. `rev-stealth` is the only crates.io
      # publish target, so we package + dry-run-publish it explicitly.
      - name: cargo package -p rev-stealth
        run: cargo package -p rev-stealth --allow-dirty --no-verify
      - name: cargo publish dry-run (rev-stealth)
        run: cargo publish --dry-run --allow-dirty -p rev-stealth

  # Slice B-1 Delta 2: Homebrew tap audit gate.
  #
  # Runs `brew audit --strict` (offline) against the canonical
  # Formula/rev-stealth.rb so the tap-repo bootstrap (documented in
  # docs/distribution.md) never publishes a formula that fails
  # Homebrew's strict audit. macOS runner is used because `brew` is
  # preinstalled there; the formula targets the macOS tap user flow.
  #
  # `--online` is INTENTIONALLY OFF until the formula stops carrying
  # the placeholder `v1.3.0.tar.gz` URL with the all-zero sha256 —
  # release-please rewrites url + sha256 only AFTER a real tag has
  # published the archive, so an online audit on PR / dry-run would
  # 404 against the unpublished archive every time. Round-1 reviewer
  # (Codex) flagged this as a deterministic-fail risk. The release
  # runbook (docs/distribution.md step 4) keeps `--online` for the
  # tap-bootstrap step where the URL is already real.
  #
  # Audit is gated to PR + workflow_dispatch dry_run only; on real
  # tag push the audit runs in the tap repo's own CI against the
  # already-published archive.
  brew-audit:
    name: brew audit (formula)
    needs: preflight
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: brew --version
        run: brew --version
      - name: brew audit --strict (offline)
        run: brew audit --strict --formula ./Formula/rev-stealth.rb
      - name: brew test-bot tap-syntax (optional)
        # `--only-tap-syntax` runs the same syntax checks the tap CI
        # would run if Formula/rev-stealth.rb lived in
        # sasuketorii/homebrew-rev-stealth. Treated as advisory because
        # test-bot occasionally needs a tap repo context that doesn't
        # exist here; the strict audit above is the hard gate.
        continue-on-error: true
        run: brew test-bot --only-tap-syntax ./Formula/rev-stealth.rb || true

  build-binaries:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Slice B-1 round-2 fix (Codex round-2 high finding): this job is
    # the build/dry-run surface. It does NOT request `id-token: write`
    # or `attestations: write`, so a PR build or workflow_dispatch
    # dry-run cannot mint an OIDC JWT or write GitHub attestation
    # records even if a later edit accidentally inverted a step `if:`.
    # All Sigstore/Rekor + provenance authority is owned by the
    # downstream push-only `sign-binaries` job.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            cross: false
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-stable
          workspaces: |
            . -> target

      - name: Install cross toolchain (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install musl tools (Linux x86_64)
        if: matrix.os == 'ubuntu-22.04' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: cargo build --release
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --target "$BUILD_TARGET" \
            --bin rev-stealth --bin stealth-mcp --bin rev-auth

      - name: Stage tarball
        id: stage
        env:
          BUILD_TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -eu
          VERSION="$REF_NAME"
          if [ "$EVENT_NAME" != "push" ]; then
            VERSION="dev-${SHORT_SHA:0:8}"
          fi
          NAME="rev-stealth-${VERSION}-${BUILD_TARGET}"
          mkdir -p "dist/${NAME}"
          cp "target/${BUILD_TARGET}/release/rev-stealth"  "dist/${NAME}/"
          cp "target/${BUILD_TARGET}/release/stealth-mcp"  "dist/${NAME}/"
          cp "target/${BUILD_TARGET}/release/rev-auth"     "dist/${NAME}/"
          cp README.md LICENSE                             "dist/${NAME}/"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "archive=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"          >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Slice B-1 round-2 fix (Codex round-2 high finding): push-only sign
  # job. This job is the SOLE holder of `id-token: write` +
  # `attestations: write` permission in the binary supply-chain path.
  # build-binaries above runs OIDC-less for PR / dry-run; this job
  # downloads the staged tarballs and performs cosign keyless sign-blob,
  # cosign verify-blob (self-check), actions/attest-build-provenance
  # (SLSA L3), and `gh attestation verify --bundle` (self-check) —
  # ALL on `github.event_name == 'push'` only.
  #
  # NOTE on pin: actions/attest-build-provenance is pinned to @v4 (the
  # current stable major as of round-2 review). v2 was the round-1 pin
  # before the reviewer pointed out v4 is the recommended major.
  sign-binaries:
    name: sign + attest binary (${{ matrix.target }})
    needs: build-binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist
      - name: Locate archive
        id: stage
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ARCHIVE="$(find dist -maxdepth 2 -type f -name "rev-stealth-*-${BUILD_TARGET}.tar.gz" | head -n1)"
          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "::error::No archive found for target ${BUILD_TARGET} under dist/"
            ls -R dist || true
            exit 1
          fi
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Cosign sign-blob (keyless OIDC)
        env:
          COSIGN_YES: "true"
          ARCHIVE: ${{ steps.stage.outputs.archive }}
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --output-signature "${ARCHIVE}.sig" \
            --output-certificate "${ARCHIVE}-keyless.pem" \
            "${ARCHIVE}"
      - name: Cosign verify-blob (self-check)
        env:
          ARCHIVE: ${{ steps.stage.outputs.archive }}
          # Identity is the GitHub Actions OIDC SAN for this workflow.
          # The regexp pin keeps `cosign verify-blob` from accepting
          # unrelated keyless signers.
          CERT_IDENTITY_REGEXP: "^https://github\\.com/${{ github.repository }}/\\.github/workflows/release\\.yml@"
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign verify-blob \
            --certificate "${ARCHIVE}-keyless.pem" \
            --signature "${ARCHIVE}.sig" \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${CERT_OIDC_ISSUER}" \
            "${ARCHIVE}"
      - name: Attest build provenance (SLSA L3)
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.stage.outputs.archive }}
      - name: gh attestation verify (self-check)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.stage.outputs.archive }}
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
          REPO: ${{ github.repository }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          set -euo pipefail
          if [ -z "${ATTESTATION:-}" ] || [ ! -f "${ATTESTATION}" ]; then
            echo "::error::attest-build-provenance bundle-path is empty or missing: '${ATTESTATION:-<unset>}'"
            exit 1
          fi
          gh attestation verify "${ARCHIVE}" \
            --bundle "${ATTESTATION}" \
            --repo "${REPO}" \
            --signer-workflow "${SIGNER_WORKFLOW}"
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-signed-${{ matrix.target }}
          # Re-upload the entire dist/ tree so the downstream
          # gh-release job sees the tarball alongside its .sig / .pem
          # without depending on two artifact names for one archive.
          path: dist/*
          if-no-files-found: error

  package-deb:
    name: package .deb (${{ matrix.target }})
    needs: build-binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install --locked cargo-deb
      - name: Restore release binary
        uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist
      - name: Stage target/release/rev-stealth for cargo-deb
        run: |
          set -eu
          mkdir -p target/release
          ARCHIVE=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          tar -xzf "${ARCHIVE}" -C dist/
          BIN=$(find dist -type f -name rev-stealth | head -n 1)
          cp "${BIN}" target/release/rev-stealth
      - name: cargo deb --no-build
        run: cargo deb --no-build -p rev-stealth --output dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: dist/*.deb
          if-no-files-found: error

  package-rpm:
    name: package .rpm (${{ matrix.target }})
    needs: build-binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-generate-rpm
        run: cargo install --locked cargo-generate-rpm
      - name: Restore release binary
        uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist
      - name: Stage target/release/rev-stealth
        run: |
          set -eu
          mkdir -p target/release
          ARCHIVE=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          tar -xzf "${ARCHIVE}" -C dist/
          BIN=$(find dist -type f -name rev-stealth | head -n 1)
          cp "${BIN}" target/release/rev-stealth
      - name: cargo generate-rpm
        run: cargo generate-rpm -p rev-stealth --output dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.target }}
          path: dist/*.rpm
          if-no-files-found: error

  oci-image:
    name: oci image (distroless, multi-arch)
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Slice B-1 round-2 fix (Codex round-2 high finding): OCI build job
    # holds NO id-token/attestations authority. PR + dry-run runs that
    # land in this job can build the image and (on tag push only)
    # push + trivy-scan it, but they cannot mint an OIDC JWT for
    # Sigstore signing or attestation. The downstream push-only
    # `sign-image` job owns those permissions.
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Slice B-1 Delta 7: on workflow_dispatch dry_run we still build the
      # multi-arch image to exercise the Dockerfile + buildx path, but we
      # never push to GHCR (no login above, no `push: true` below). On PR
      # we keep the existing build-only behaviour.
      - name: Build (and push on tag) multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.distroless
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.2.0
      - name: trivy image scan (HIGH,CRITICAL)
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        run: trivy --config trivy.yaml image "$IMAGE_REF"

  # Slice B-1 round-2 fix: push-only image signing + attestation.
  # Sole holder of `id-token: write` + `attestations: write` on the
  # OCI side. Consumes the digest output from `oci-image` (which has
  # already pushed the image to GHCR on tag push). attest-build-
  # provenance is pinned to @v4 — the current stable major.
  sign-image:
    name: sign + attest oci image
    needs: oci-image
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Cosign sign image (keyless)
        env:
          COSIGN_YES: "true"
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.oci-image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"
      - name: Attest image provenance (SLSA L3)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.oci-image.outputs.digest }}
          push-to-registry: true

  cargo-publish:
    name: cargo publish ${{ github.event_name == 'push' && 'real' || 'dry-run' }}
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish (dry-run)
        if: github.event_name != 'push'
        run: cargo publish --dry-run --allow-dirty -p rev-stealth
      - name: cargo publish (real)
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p rev-stealth

  gh-release:
    name: draft GitHub release
    # Slice B-1 round-3 fix (Codex round-3 high finding): on
    # `workflow_dispatch dry_run=true`, `sign-binaries` and
    # `sign-image` are skipped (their job-level
    # `if: github.event_name == 'push'`). GitHub Actions default
    # `needs:` semantics propagate skip downstream, which would skip
    # `gh-release` too and break the dry-run inventory path. The
    # job-level `if:` below uses `!cancelled()` to override default
    # status-check gating and explicitly accepts `skipped` for the
    # two sign-* dependencies while still requiring `success` for
    # all the deterministic deps. The download-artifact step has no
    # `name:` filter and naturally collects whichever artifacts
    # exist (`bin-${target}` on dry-run; `bin-${target}` +
    # `bin-signed-${target}` + deb/rpm on push).
    needs:
      - build-binaries
      - sign-binaries
      - package-deb
      - package-rpm
      - oci-image
      - sign-image
      - cargo-publish
    # Slice B-1 Delta 7: real tag push uploads a draft release.
    # workflow_dispatch dry_run also enters this job but stops short of
    # creating the release — it just downloads + lists artifacts so the
    # operator can confirm the full asset set materializes off-tag.
    # NOTE: dry-run inventory is signing-free; cosign sign-blob and
    # attest-build-provenance both stay gated on real tag push only
    # (see sign-binaries / sign-image jobs) because they emit
    # permanent Sigstore/Rekor + GitHub attestation records.
    #
    # `!cancelled()` overrides default status-check gating so the job
    # is reachable even when `sign-binaries` / `sign-image` are
    # skipped on dry-run. The explicit result checks below require
    # success for the always-running deps and accept either
    # success or skipped for the two push-only sign deps.
    if: |
      !cancelled() &&
      needs.build-binaries.result == 'success' &&
      needs.package-deb.result == 'success' &&
      needs.package-rpm.result == 'success' &&
      needs.oci-image.result == 'success' &&
      needs.cargo-publish.result == 'success' &&
      (needs.sign-binaries.result == 'success' || needs.sign-binaries.result == 'skipped') &&
      (needs.sign-image.result == 'success' || needs.sign-image.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List release artifacts (dry-run inventory)
        run: |
          set -euo pipefail
          echo "=== release artifact inventory ==="
          # On dry-run the .sig / -keyless.pem files will be absent
          # because sign-blob is push-only by design. The presence /
          # absence of those globs in the listing is itself the proof
          # that dry-run did not produce any Sigstore side effects.
          find dist -maxdepth 4 -type f \
            \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \
               -o -name '*.tar.gz.sig' -o -name '*-keyless.pem' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            | sort
      - name: Draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.tar.gz.sha256
            dist/**/*.tar.gz.sig
            dist/**/*-keyless.pem
            dist/**/*.deb
            dist/**/*.rpm

# release-please runs in a separate workflow (release-please.yml) because it
# triggers on `push: branches: [main]` rather than tag pushes, and combining
# the two in one workflow would either dead-code the job or run it on the
# wrong event.
