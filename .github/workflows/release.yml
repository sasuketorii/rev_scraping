name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  package-dryrun:
    name: cargo package dry run
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: cargo package --workspace --allow-dirty --no-verify
        run: cargo package --workspace --allow-dirty --no-verify

  build-binaries:
    name: build binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-stable
          workspaces: |
            . -> target
      - name: Install Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - name: cargo build --release
        run: cargo build --release --bin rev-stealth --bin stealth-mcp --bin rev-auth
      - name: Strip Linux binaries
        if: runner.os == 'Linux'
        run: strip target/release/rev-stealth target/release/stealth-mcp target/release/rev-auth
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: rev-scraping-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/rev-stealth
            target/release/stealth-mcp
            target/release/rev-auth
          if-no-files-found: error

  gh-release:
    name: draft GitHub release
    needs: [package-dryrun, build-binaries]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/**/rev-stealth
            dist/**/stealth-mcp
            dist/**/rev-auth
