name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  check:
    name: cargo check (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
        toolchain: ["1.83", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.toolchain == 'stable'
      - uses: dtolnay/rust-toolchain@1.83.0
        if: matrix.toolchain == '1.83'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.toolchain }}
          workspaces: |
            . -> target
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

  clippy:
    name: cargo clippy (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
        toolchain: ["1.83", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.toolchain == 'stable'
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@1.83.0
        if: matrix.toolchain == '1.83'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.toolchain }}
          workspaces: |
            . -> target
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
        toolchain: ["1.83", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.toolchain == 'stable'
      - uses: dtolnay/rust-toolchain@1.83.0
        if: matrix.toolchain == '1.83'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.toolchain }}
          workspaces: |
            . -> target
      - name: cargo test --workspace --no-fail-fast
        run: cargo test --workspace --no-fail-fast
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            target/**/*.log
            target/**/*.stderr
          if-no-files-found: ignore

  docs:
    name: cargo doc
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: cargo doc --workspace --no-deps
        run: cargo doc --workspace --no-deps

  spdx:
    name: source and license checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: Check source annotations and SPDX
        run: bash scripts/check_source_and_spdx.sh
      - name: Check BSL contamination
        run: bash scripts/check_bsl_contamination.sh

  build-obscura:
    name: Build vendored obscura binary
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      obscura-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - id: key
        name: Compute obscura cache key
        run: |
          if [ -d vendor/obscura ]; then
            HASH=$(git -C vendor/obscura rev-parse HEAD 2>/dev/null || find vendor/obscura \( -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' \) -type f | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
          else
            HASH=none
          fi
          echo "value=$HASH" >> "$GITHUB_OUTPUT"
      - name: Cache obscura target dir
        id: obscura-cache
        uses: actions/cache@v4
        with:
          path: vendor/obscura/target
          key: obscura-target-${{ runner.os }}-${{ steps.key.outputs.value }}
          restore-keys: |
            obscura-target-${{ runner.os }}-
      - name: Build obscura --release
        if: hashFiles('vendor/obscura/Cargo.toml') != ''
        run: |
          cd vendor/obscura
          cargo build --release --bin obscura
      - name: Upload obscura binary
        if: hashFiles('vendor/obscura/Cargo.toml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: obscura-binary
          path: vendor/obscura/target/release/obscura
          retention-days: 1
          if-no-files-found: error

  test-obscura-lifecycle:
    name: E2E obscura_lifecycle
    needs: build-obscura
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: Install Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - name: Download obscura binary
        uses: actions/download-artifact@v4
        with:
          name: obscura-binary
          path: vendor/obscura/target/release/
      - name: chmod +x obscura
        run: chmod +x vendor/obscura/target/release/obscura
      - name: cargo test -- --ignored obscura_lifecycle
        env:
          REV_SCRAPING_RUN_OBSCURA: "1"
        run: |
          export OBSCURA_BIN="$(pwd)/vendor/obscura/target/release/obscura"
          export REV_STEALTH_OBSCURA="$OBSCURA_BIN"
          cargo test --workspace -- --ignored obscura_lifecycle
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: obscura-lifecycle-logs
          path: |
            target/**/*.log
            target/**/*.stderr
          if-no-files-found: ignore

  test-cdp-shim-lifecycle:
    name: E2E cdp_shim_e2e
    needs: build-obscura
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: Install Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - name: Download obscura binary
        uses: actions/download-artifact@v4
        with:
          name: obscura-binary
          path: vendor/obscura/target/release/
      - name: chmod +x obscura
        run: chmod +x vendor/obscura/target/release/obscura
      - name: cargo test -- --ignored cdp_shim_e2e
        env:
          REV_SCRAPING_RUN_OBSCURA: "1"
        run: |
          export OBSCURA_BIN="$(pwd)/vendor/obscura/target/release/obscura"
          export REV_STEALTH_OBSCURA="$OBSCURA_BIN"
          cargo test --workspace -- --ignored cdp_shim_e2e
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cdp-shim-logs
          path: |
            target/**/*.log
            target/**/*.stderr
          if-no-files-found: ignore

  mcp-schema-lint:
    # Lane E P11: freshness gate for docs/MCP_REFERENCE.md.
    #
    # The generator binary (`stealth-mcp/src/bin/gen_reference.rs`) renders
    # the reference document from `tool_definitions()` and
    # `all_error_kind_docs()`. In `--check` mode it exits 1 if the committed
    # file disagrees with a fresh render. This complements (does not
    # replace) the `mcp_reference_freshness` regression test in the workspace
    # test suite; running it as its own job gives a clearer failure surface
    # when a contributor forgets to regenerate the doc.
    name: MCP reference freshness
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: cargo run -p stealth-mcp --bin gen_reference -- --check
        run: cargo run -p stealth-mcp --bin gen_reference -- --check

  config-cli-smoke:
    # Lane E P11: smoke-test `rev-stealth config init --target=policy
    # --non-interactive --force` inside a throwaway $HOME so the CI verifies
    # the non-interactive init path stays exit-0 on a fresh profile. The
    # `--non-interactive` flag is the contract documented in P6.2 and must
    # never block on stdin.
    name: config CLI non-interactive smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: cargo build -p rev-stealth --bin rev-stealth
        run: cargo build -p rev-stealth --bin rev-stealth
      - name: config init --target=policy --non-interactive --force
        run: |
          set -euxo pipefail
          TMPHOME="$(mktemp -d)"
          export HOME="$TMPHOME"
          ./target/debug/rev-stealth config init \
            --target=policy --non-interactive --force
          # Verify the policy file was materialized inside the throwaway HOME.
          test -f "$TMPHOME/.rev_scraping/policy.toml"

  hermes-contract:
    # Lane E P11: run the Hermes (rev-scraping-mcp) plugin contract tests.
    # 20-test python suite under dist/hermes/rev-scraping-mcp/tests/ that
    # gates the stealth-mcp <-> Hermes wire shape (lifecycle, schema bridge,
    # tool proxy). Pure stdlib `unittest`; no extra pip install needed.
    name: Hermes plugin contract tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: python3 -m unittest discover dist/hermes/rev-scraping-mcp/tests
        run: python3 -m unittest discover dist/hermes/rev-scraping-mcp/tests

  systemd-analyze:
    # Lane E P11: lint the shipped systemd units.
    #
    # We pin `ubuntu-24.04` (systemd 255) because the shipped VPN unit at
    # `dist/systemd/system/rev-stealth-vpn@.service` uses
    # `LoadCredentialEncrypted=` and the `%d` credential specifier, both of
    # which require systemd >=252. `ubuntu-22.04` (systemd 249) would let
    # the directives parse as unknown and still report success in some
    # cases, masking real breakage. See `docs/deploy/vps.md` for the
    # runtime requirement that mirrors this CI pin.
    #
    # `verify` is run against every `.service` AND `.timer` file we ship so
    # the doctor timer is also covered, not just the services.
    name: systemd-analyze verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Confirm systemd >= 252
        run: |
          set -euxo pipefail
          ver="$(systemctl --version | awk 'NR==1{print $2}')"
          echo "host systemd version: $ver"
          if [ "$ver" -lt 252 ]; then
            echo "systemd $ver too old for LoadCredentialEncrypted= / %d" >&2
            exit 1
          fi
      - name: systemd-analyze verify (services + timer)
        run: |
          set -euxo pipefail
          # Collect every unit file we ship under dist/systemd/system/. We
          # globstar both *.service and *.timer so the doctor timer is in
          # scope alongside the services.
          shopt -s nullglob
          units=( dist/systemd/system/*.service dist/systemd/system/*.timer )
          if [ "${#units[@]}" -eq 0 ]; then
            echo "no systemd units found under dist/systemd/system/" >&2
            exit 1
          fi
          echo "verifying: ${units[*]}"
          systemd-analyze verify "${units[@]}"

  headless-auth:
    # Lane E P11: headless authenticated-spider smoke. The real test path
    # needs Chrome + Xvfb on Linux (or macOS), which the basic ubuntu
    # runner can support, but the underlying coverage is gated on harness
    # bits not yet in this lane. We keep the job as a placeholder so the
    # workflow matrix exposes "headless-auth" in the run graph and the
    # follow-up lane can flip `if: false` to enable it without renaming a
    # required check.
    name: headless authenticated smoke (skipped)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Annotate skip reason
        run: |
          echo "::notice title=headless-auth::skipped; opt-in gated below."
      - name: placeholder (opt-in)
        if: false
        run: |
          echo "headless-auth would run here"

  test-spider-fallback:
    name: E2E e2e_spider_fallback
    needs: build-obscura
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: Install Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - name: Download obscura binary
        uses: actions/download-artifact@v4
        with:
          name: obscura-binary
          path: vendor/obscura/target/release/
      - name: chmod +x obscura
        run: chmod +x vendor/obscura/target/release/obscura
      - name: cargo test -- --ignored e2e_spider_fallback
        env:
          REV_SCRAPING_RUN_OBSCURA: "1"
        run: |
          export OBSCURA_BIN="$(pwd)/vendor/obscura/target/release/obscura"
          export REV_STEALTH_OBSCURA="$OBSCURA_BIN"
          cargo test --workspace -- --ignored e2e_spider_fallback
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spider-fallback-logs
          path: |
            target/**/*.log
            target/**/*.stderr
          if-no-files-found: ignore

  # =========================================================================
  # Lane I — API stability & semver (v1.3)
  # =========================================================================
  #
  # I.1: cli-public-api snapshot drift gate. Drift = any byte-level diff
  # against `.agent/v1.3/cli-public-api.snapshot.json`. To merge a drifting
  # PR, the contributor must regenerate the snapshot, commit the diff, and
  # apply the `api-additive` (new flag/cmd/env) or `api-breaking` (removed,
  # renamed, semantically changed) PR label.
  cli-public-api-snapshot:
    name: CLI public-API snapshot drift
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: cargo build -p rev-stealth
        run: cargo build -p rev-stealth
      - name: regenerate + check snapshot (HARD — drift always fails)
        run: |
          set -euo pipefail
          # R2 hardening (Codex R2 scoring finding): a contributor MUST commit
          # the regenerated snapshot in the same PR as the change that mutated
          # the public surface — labels NEVER waive this. Why: if the snapshot
          # gate could be waived with `api-additive`, the BASE-vs-HEAD
          # mcp-schema-breaking detector would diff a stale base snapshot
          # against the same stale live snapshot, miss the real breaking
          # change, and let the PR merge with the wrong label.
          #
          # Acceptable PR flow:
          #   1. mutate CLI / MCP source
          #   2. `./scripts/cli-public-api-snapshot.sh` to regenerate
          #   3. commit the snapshot diff in the same PR
          #   4. add `api-additive` / `api-breaking` / `mcp-schema-breaking`
          #      based on the regenerated diff (label classifies; it does
          #      not waive the regeneration requirement).
          ./scripts/cli-public-api-snapshot.sh --check

  # I.2: cargo-public-api Rust API diff gate (HARD).
  #
  # R2 hardening (Lane I fix-up): promoted from advisory to hard gate. When the
  # rustdoc-JSON-derived public surface of any covered crate changes against
  # the PR base, the PR MUST carry exactly one of the labels
  # `api-additive` (new pub items) or `api-breaking` (removed/renamed/retyped
  # pub items). The label check runs unconditionally on PR; the diff step then
  # fails closed if a drift exists without the corresponding label.
  #
  # Rationale: the v1.3 R1 advisory mode meant a reviewer could miss a silent
  # `pub` removal. The R2 hard gate forces an explicit ack via PR label and
  # makes the snapshot pipeline (Lane I.1) and Rust pub-API pipeline (I.2)
  # symmetric in enforcement strength.
  cargo-public-api-diff:
    name: cargo-public-api diff (hard gate)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # NOTE: continue-on-error intentionally OMITTED — this is now blocking.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # cargo-public-api consumes rustdoc JSON, whose schema changes per
      # nightly. Pin the nightly to the date that cargo-public-api 0.39.x is
      # validated against (see
      # https://github.com/cargo-public-api/cargo-public-api/blob/main/scripts/release-helper/src/version_info.rs).
      # Floating `nightly` can break this job between cargo-public-api
      # releases. Re-pin in lockstep when bumping cargo-public-api in v1.4.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-10-13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-nightly-2024-10-13
          workspaces: |
            . -> target
      - name: install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.39.0
      - name: fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin "$BASE_REF"
      - name: diff against base + enforce label
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          # cargo-public-api 0.39+ expects a commit range `<base>..<head>`.
          BASE_SHA="$(git rev-parse "origin/$BASE_REF")"
          HEAD_SHA="$(git rev-parse HEAD)"

          # cargo-public-api 0.39.0 returns rc=1 for BOTH "surface diverged
          # under --deny=all" AND "rustdoc/build failure". To distinguish
          # diff-vs-exec-failure we run two passes per crate:
          #
          #   Pass 1: `cargo public-api --package <crate> diff <range>`
          #           — no --deny. rc != 0 ⇒ tool/build/range failure
          #             (a real diff is allowed; the tool only emits the diff
          #              to stdout and exits 0 without --deny).
          #   Pass 2: `cargo public-api --package <crate> diff --deny=all <range>`
          #           — `--deny` MUST come AFTER `diff` (0.39 clap rejects
          #             `--deny` as a top-level option). rc != 0 ⇒ surface
          #             diverged.
          #
          # If pass 1 is healthy and pass 2 is non-zero, we know it is a real
          # diff and the label gate applies. If pass 1 fails, the gate fails
          # closed — labels cannot waive a broken invocation.
          #
          # Workspace coverage (Codex R2 scoring finding): enumerate ALL
          # workspace members that have library targets via cargo metadata
          # instead of hand-listing six. binary-only crates (no [lib]) are
          # silently dropped by cargo-public-api, so we filter to lib targets.
          diff_seen=0
          exec_fail=0
          tmpdir="$(mktemp -d)"
          # Process-substitution pipelines do NOT propagate exit status under
          # `set -euo pipefail` (Codex R2 hardening finding). Materialize the
          # crate list to a temp file with explicit exit-code checks at each
          # stage so a metadata/helper failure cannot pretend "no diff".
          metadata_json="$tmpdir/cargo-metadata.json"
          if ! cargo metadata --no-deps --format-version=1 > "$metadata_json"; then
            echo "::error::cargo metadata --no-deps failed; cannot enumerate workspace lib crates."
            exit 1
          fi
          crate_list="$tmpdir/workspace-libs.txt"
          if ! python3 scripts/workspace-lib-crates.py < "$metadata_json" > "$crate_list"; then
            echo "::error::scripts/workspace-lib-crates.py failed; cannot enumerate workspace lib crates."
            exit 1
          fi
          mapfile -t WORKSPACE_LIBS < "$crate_list"
          if [[ "${#WORKSPACE_LIBS[@]}" -eq 0 ]]; then
            echo "::error::workspace lib crate list is empty — refusing to fall through with zero coverage. Inspect $crate_list."
            exit 1
          fi
          echo "[cargo-public-api] workspace lib crates (${#WORKSPACE_LIBS[@]}): ${WORKSPACE_LIBS[*]}"
          for crate in "${WORKSPACE_LIBS[@]}"; do
            echo "::group::cargo public-api diff -p $crate"

            # Pass 1: smoke run, no --deny. Non-zero ⇒ exec failure.
            smoke_rc=0
            cargo public-api --package "$crate" \
              diff "$BASE_SHA..$HEAD_SHA" \
              > "$tmpdir/${crate}.smoke.out" 2> "$tmpdir/${crate}.smoke.err" \
              || smoke_rc=$?
            cat "$tmpdir/${crate}.smoke.out"
            cat "$tmpdir/${crate}.smoke.err" >&2
            if [[ "$smoke_rc" -ne 0 ]]; then
              echo "::error::cargo public-api -p $crate (pass 1, no --deny) exited rc=$smoke_rc — treating as tool/build failure, NOT a diff. Labels do not waive this."
              exec_fail=1
              echo "::endgroup::"
              continue
            fi

            # Pass 2: deny-all run. Non-zero ⇒ real surface diff.
            deny_rc=0
            cargo public-api --package "$crate" \
              diff --deny=all "$BASE_SHA..$HEAD_SHA" \
              > "$tmpdir/${crate}.deny.out" 2> "$tmpdir/${crate}.deny.err" \
              || deny_rc=$?
            cat "$tmpdir/${crate}.deny.out"
            cat "$tmpdir/${crate}.deny.err" >&2
            if [[ "$deny_rc" -ne 0 ]]; then
              diff_seen=1
            fi
            echo "::endgroup::"
          done

          if [[ "$exec_fail" -ne 0 ]]; then
            echo "::error::cargo-public-api hard gate cannot evaluate label compliance because at least one crate's pass-1 smoke run failed. Fix the underlying tool/build error; labels do not waive this."
            exit 1
          fi

          if [[ "$diff_seen" -eq 0 ]]; then
            echo "[cargo-public-api] no public-surface diff vs $BASE_REF — gate PASS."
            exit 0
          fi

          # Step 2: surface diverged ⇒ a label is mandatory. Read labels from
          # the PR event payload (no extra API call required); fall back to
          # the REST API if the payload is empty (defensive).
          labels_csv="$(printf '%s' "$PR_LABELS_JSON" | python3 -c 'import json,sys; ls=json.load(sys.stdin) or []; print(",".join(l.get("name","") for l in ls))')"
          if [[ -z "$labels_csv" ]]; then
            labels_csv="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/labels" --jq '[.[].name] | join(",")' || echo "")"
          fi
          echo "[cargo-public-api] PR labels = '${labels_csv:-<none>}'"

          has_additive=0
          has_breaking=0
          IFS=',' read -ra arr <<< "$labels_csv"
          for l in "${arr[@]}"; do
            case "$l" in
              api-additive)  has_additive=1 ;;
              api-breaking)  has_breaking=1 ;;
            esac
          done

          if [[ "$has_additive" -eq 0 && "$has_breaking" -eq 0 ]]; then
            echo "::error::cargo-public-api detected a public-surface diff vs $BASE_REF but no \`api-additive\` or \`api-breaking\` PR label is set."
            echo "::error::Decide: pure additions (new pub item, no removal/rename) ⇒ apply \`api-additive\`."
            echo "::error::Decide: any removal, rename, signature change, or visibility narrowing ⇒ apply \`api-breaking\` AND bump per docs/compat.md."
            exit 1
          fi

          if [[ "$has_additive" -eq 1 && "$has_breaking" -eq 1 ]]; then
            echo "::error::Both \`api-additive\` and \`api-breaking\` labels are set; choose exactly one (a PR is either additive or breaking)."
            exit 1
          fi

          echo "[cargo-public-api] surface diverged; one explicit label found ⇒ gate PASS (additive=$has_additive, breaking=$has_breaking)."

  # I.5: MCP tool-schema breaking-change detector. Mirrors mcp-schema-lint
  # but specifically asserts the canonical 16-tool list (Lane I.1 snapshot)
  # has not been mutated. Drift requires `mcp-schema-breaking` PR label.
  mcp-schema-breaking-detector:
    name: MCP tool schema breaking-change
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: gen_reference freshness
        run: cargo run -q -p stealth-mcp --bin gen_reference -- --check
      - name: fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --depth=200 origin "$BASE_REF"
      - name: mcp-schema-breaking diff vs base (label-aware)
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # R2 label gate. The script uses a 3-valued exit-code contract:
          #   0 — surface unchanged
          #   2 — INTENTIONAL breaking diff (label waiver applies)
          #   any other nonzero — script execution failure (NEVER waiveable)
          # `$?` after `if/fi` returns 0 from the un-taken branch (bash spec);
          # capture via `|| rc=$?` instead so the real exit code survives.
          rc=0
          ./scripts/mcp-schema-breaking.sh --check || rc=$?
          if [[ "$rc" -eq 0 ]]; then
            exit 0
          fi
          if [[ "$rc" -ne 2 ]]; then
            echo "::error::mcp-schema-breaking.sh exited rc=$rc (script execution failure, not a breaking diff). Labels do not waive this. Fix the underlying error."
            exit "$rc"
          fi
          if [[ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]]; then
            exit "$rc"
          fi
          labels_csv="$(printf '%s' "$PR_LABELS_JSON" | python3 -c 'import json,sys; ls=json.load(sys.stdin) or []; print(",".join(l.get("name","") for l in ls))')"
          echo "[mcp-schema-breaking] PR labels = '${labels_csv:-<none>}'"
          has_breaking=0
          IFS=',' read -ra arr <<< "$labels_csv"
          for l in "${arr[@]}"; do
            [[ "$l" == "mcp-schema-breaking" ]] && has_breaking=1
          done
          if [[ "$has_breaking" -eq 1 ]]; then
            echo "::warning::MCP schema breaking change detected and explicit \`mcp-schema-breaking\` label is set; gate PASS."
            exit 0
          fi
          echo "::error::MCP tool-schema breaking change requires the \`mcp-schema-breaking\` PR label (and a 2-major bump per docs/compat.md)."
          exit "$rc"

  # I.6: see crates/stealth-cli/tests/deprecated_completeness.rs (unit test).

  # Lane G.3 (v1.3 Black-Belt CLI): shell-completion drift gate.
  #
  # Regenerates `target/completions/{bash,zsh,fish,nushell}/rev-stealth.*` via
  # `scripts/gen_completions.sh` and fails if the committed scripts disagree
  # with a fresh render. The script invokes the hidden
  # `rev-stealth completions <shell>` subcommand, which reads the clap
  # CommandFactory tree — so the gate also covers --help drift in
  # subcommands/flags reachable from completion.
  completion-drift:
    name: shell-completion drift
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - name: assert all 4 completion files are tracked
        # Round-1 reviewer (G.3) finding #1: `git diff --exit-code` alone
        # ignores untracked files, so a contributor could accidentally delete
        # the committed completions and the gate would still pass after regen.
        # Enumerate the 4 expected files and require each to be tracked BEFORE
        # we regenerate.
        run: |
          set -euo pipefail
          missing=0
          for f in \
              target/completions/bash/rev-stealth.bash \
              target/completions/zsh/rev-stealth.zsh \
              target/completions/fish/rev-stealth.fish \
              target/completions/nushell/rev-stealth.nu; do
            if ! git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              echo "::error::expected completion file is not tracked: $f" >&2
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo "::error::commit the missing target/completions/ files (regen via ./scripts/gen_completions.sh)." >&2
            exit 1
          fi
      - name: regenerate completions
        run: ./scripts/gen_completions.sh
      - name: diff committed vs regenerated (modifications)
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- target/completions/; then
            echo "::error::shell completion scripts drifted (modified content). Run \`./scripts/gen_completions.sh\` and commit the result." >&2
            exit 1
          fi
      - name: diff committed vs regenerated (untracked / additions)
        # Defensive sibling to the previous step: `git diff --exit-code` does
        # not flag untracked files, so a regen producing a *new* file (e.g.
        # add a future shell) would silently pass the diff above. `git status
        # --porcelain` lists tracked-modified AND untracked entries; we fail
        # if anything under target/completions/ is reported.
        run: |
          set -euo pipefail
          drift="$(git status --porcelain -- target/completions/)"
          if [[ -n "$drift" ]]; then
            echo "::error::untracked / unexpected completion files detected:" >&2
            echo "$drift" >&2
            echo "::error::commit them via ./scripts/gen_completions.sh + git add." >&2
            exit 1
          fi

  # I.8 (R2): fixture tests for scripts/mcp-schema-breaking.sh. Asserts the
  # 3-valued exit-code contract (0/2/other) and the four breaking-change
  # detectors (tool removal, required-arg tightening, input enum narrowing,
  # output property removal / output enum narrowing) against synthetic
  # schema_version=3 snapshot blobs. Catches regressions in the detector
  # itself before they let a real breaking PR through.
  mcp-schema-breaking-fixture-tests:
    name: MCP schema breaking detector — fixture tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: run fixture tests
        run: bash scripts/cli-public-api-snapshot.test.sh

  # I.7 (R2): keep-a-changelog 1.1 structural lint for
  # CHANGELOG.rev_scraping.md. Mirrors the release-please-config.json
  # `changelog-path` setting and gates the `## [Unreleased]` cursor that
  # release-please relies on to compute the next bump. A malformed file
  # would fail release-please at release time instead of at PR time, so
  # we shift the check left.
  changelog-lint:
    name: CHANGELOG keep-a-changelog lint
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: changelog structural lint
        run: python3 scripts/changelog-keepachangelog-lint.py CHANGELOG.rev_scraping.md

  # Lane H Slice B-1 Delta 5: distroless image PR-time security gate.
  #
  # release.yml builds + scans the multi-arch OCI image on tag push only.
  # This PR-time job rebuilds the linux/amd64 distroless image locally
  # (no GHCR push, no QEMU multi-arch overhead) and runs trivy with
  # HIGH,CRITICAL --exit-code 1 so a Dockerfile-level regression that
  # introduces a vulnerable base layer fails the PR, not the tag push.
  #
  # Scope:
  #   - Only runs on pull_request to keep main-branch CI fast.
  #   - `--load` materializes the image into the runner's local Docker
  #     daemon so trivy can scan by reference without a registry round
  #     trip.
  #   - `--platform=linux/amd64` is sufficient for vulnerability
  #     coverage; the distroless base layer is identical across
  #     amd64/arm64 from a CVE-DB lookup standpoint.
  distroless-pr-scan:
    name: distroless image PR scan (trivy HIGH,CRITICAL)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build distroless image (linux/amd64, --load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.distroless
          platforms: linux/amd64
          load: true
          push: false
          tags: local/rev-stealth-test:pr
      - name: Self-pull smoke (image is locally addressable)
        run: |
          set -euo pipefail
          docker image inspect local/rev-stealth-test:pr >/dev/null
          docker image ls local/rev-stealth-test:pr
      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.2.0
      - name: trivy image (HIGH,CRITICAL --exit-code 1)
        run: |
          set -euo pipefail
          # `--ignore-unfixed` is intentionally OFF: an unfixed
          # HIGH/CRITICAL on a distroless base is signal we want to act
          # on (rebase the base), not silence. If we later need a
          # waiver path, add a .trivyignore with a documented expiry.
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            local/rev-stealth-test:pr
