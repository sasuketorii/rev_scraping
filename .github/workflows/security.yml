name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Initialize deny.toml if missing
        if: hashFiles('deny.toml') == ''
        run: cargo deny init
      - name: cargo deny check
        run: cargo deny check

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit --deny warnings
        run: cargo audit --deny warnings

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-22.04-stable
          workspaces: |
            . -> target
      - uses: gitleaks/gitleaks-action@v2
