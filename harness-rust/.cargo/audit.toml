[advisories]
ignore = []
# notice/unmaintained/unsound are surfaced as warnings and failed by output.deny.
informational_warnings = ["unmaintained", "unsound", "notice"]
severity_threshold = "low"

[database]
url = "https://github.com/RustSec/advisory-db.git"
fetch = true
stale = false

[output]
# Fail informational advisory kinds with cargo-audit 0.22.1.
deny = ["unmaintained", "unsound", "yanked"]
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
