sandbox_mode = "workspace-write"
approval_policy = "never"
model = "gpt-5.5"
model_reasoning_effort = "medium"

web_search = "cached"

[mcp_servers.semantic]
command = "./scripts/launch-semantic-mcp.sh"
# WHY: semantic-mcp operates ONLY on the project-local semantic index (no network,
# no OAuth, no external side effects). A non-interactive `codex exec` worker has no
# TTY to answer an approval prompt, so an unapproved sem.* call fails with
# "user cancelled MCP tool call". We auto-approve a MINIMUM allowlist of 6 tools
# bounded by a single boundary: NON-DESTRUCTIVE (not "pure read-only").
#   (a) read-only discovery: health / context.top_k / search / registry.query.
#   (b) append-only capsule-cache generation: capsule / preflight — these INSERT
#       into the `capsules` cache table (append-only: no ON CONFLICT/UPDATE/DELETE,
#       never touches symbols/components/registry rows). Worst case is unbounded
#       growth of the `capsules` cache, fully reclaimable via sem.admin.gc.
# Everything that mutates/soft-deletes registry rows or runs GC stays at the
# default ("prompt"). This INCLUDES registry.upsert: its status normalization
# admits "deleted", so with ON CONFLICT DO UPDATE it could soft-delete an existing
# component without a human. So registry.upsert/set_status/delete and admin.gc all
# stay at "prompt". DO NOT set the default to "approve" and DO NOT copy this
# pattern to any OAuth/network MCP server (supabase, stripe, cloudflare).
default_tools_approval_mode = "prompt"

[mcp_servers.semantic.tools."sem.preflight"]
approval_mode = "approve"

[mcp_servers.semantic.tools."sem.health"]
approval_mode = "approve"

[mcp_servers.semantic.tools."sem.context.top_k"]
approval_mode = "approve"

[mcp_servers.semantic.tools."sem.capsule"]
approval_mode = "approve"

[mcp_servers.semantic.tools."sem.search"]
approval_mode = "approve"

[mcp_servers.semantic.tools."sem.registry.query"]
approval_mode = "approve"

# Chrome DevTools MCP — optional per-project opt-in, not in baseline release.
# [mcp_servers.chrome_devtools]
# command = "npx chrome-devtools-mcp@<pin>"

[features]
multi_agent = true

[agents.coder]
description = "実装担当。設計に基づいてコード変更と検証を行う。"
config_file = "agents/coder.toml"

[agents.system_planner]
description = "システム設計プランナー。要件整理と実装計画を作成する。"
config_file = "agents/system_planner.toml"

[agents.plan_reviewer]
description = "プランレビュワー。計画の抜け漏れと実行可能性を検証する。"
config_file = "agents/plan_reviewer.toml"

[agents.security_reviewer]
description = "セキュリティレビュワー。脆弱性と攻撃面を重点レビューする。"
config_file = "agents/security_reviewer.toml"

[agents.performance_reviewer]
description = "パフォーマンスレビュワー。速度・負荷・スケーラビリティを評価する。"
config_file = "agents/performance_reviewer.toml"

[agents.consistency_reviewer]
description = "整合性レビュワー。仕様・設計・実装・テスト間の一貫性を検証する。"
config_file = "agents/consistency_reviewer.toml"

[agents.alternative_reviewer]
description = "代替案レビュワー。より良い実装手段を比較して提案する。"
config_file = "agents/alternative_reviewer.toml"

[agents.stack_upgrade_researcher]
description = "技術スタック更新調査。最新安定版へのアップデート方針を調査する。"
config_file = "agents/stack_upgrade_researcher.toml"

[agents.stack_upgrade_reviewer]
description = "技術スタック更新レビュー。更新計画の妥当性とリスクを検証する。"
config_file = "agents/stack_upgrade_reviewer.toml"

[sandbox_workspace_write]
network_access = true
