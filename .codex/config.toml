sandbox_mode = "workspace-write"
approval_policy = "never"
model = "gpt-5.5"
model_reasoning_effort = "medium"

web_search = "cached"

[mcp_servers.semantic-mcp]
command = "./scripts/launch-semantic-mcp.sh"
# WHY: semantic-mcp operates ONLY on the project-local semantic index
# (no network, no OAuth, no external side effects). A non-interactive
# `codex exec` worker has no TTY to answer an approval prompt, so an
# unapproved sem.* tool call fails with "user cancelled MCP tool call".
# We auto-approve a MINIMUM allowlist of 7 tools whose blast radius is bounded
# by a single, deliberate boundary: NON-DESTRUCTIVE (not "pure read-only").
# That boundary admits two classes of tool:
#   (a) read-only discovery: health / context.top_k / search / registry.query /
#       symbols.search — these never write any table in their production paths
#       (their only INSERTs live inside #[cfg(test)] blocks, never reached at
#       runtime). symbols.search (the §4 C-b tool) is a read-only SELECT over
#       the tree-sitter `symbols` index: it issues no INSERT/UPDATE/DELETE, is
#       advisory_only, and so is non-destructive — hence inside the boundary.
#   (b) append-only capsule-cache generation: capsule / preflight — these are
#       NOT strictly read-only. capsule.rs:454 and preflight.rs:1104 each run
#       `INSERT INTO capsules (...) VALUES (...)` against the `capsules` cache
#       table. That INSERT is append-only: no ON CONFLICT, no UPDATE, no DELETE,
#       and it never touches `symbols`, `components`, or any registry row. The
#       worst case is unbounded growth of the `capsules` cache table, which is
#       fully reclaimable via `sem.admin.gc`. Because that is non-destructive
#       (it cannot overwrite, soft-delete, or lose any existing data), capsule
#       and preflight are intentionally INSIDE the auto-approve boundary.
# Everything that mutates or soft-deletes registry rows, or runs GC, stays at
# the server default ("prompt") so it requires a human in the loop. This
# explicitly INCLUDES registry.upsert: although upsert is often
# used to publish newly-created symbols, its `status` field is normalized via
# normalize_queryable_status (registry.rs ~L761) whose QUERYABLE_STATUSES
# (registry.rs L22-29) INCLUDES "deleted" — unlike set_status's
# normalize_mutable_status / MUTABLE_STATUSES (L21) which does NOT. Combined
# with upsert's `ON CONFLICT(...) DO UPDATE SET status = excluded.status`
# (registry.rs ~L264), auto-approving upsert would let a non-interactive worker
# overwrite an existing component to status="deleted" (soft-delete) without any
# human approval, bypassing the same boundary we deliberately keep on
# set_status/delete/admin.gc. So registry.upsert, registry.set_status,
# registry.delete and admin.gc all stay at "prompt".
# DO NOT change the default to "approve" and DO NOT copy this auto-approve
# pattern to any OAuth/network MCP server (e.g. supabase, stripe, cloudflare);
# those have real external blast radius.
default_tools_approval_mode = "prompt"

[mcp_servers.semantic-mcp.tools."sem.preflight"]
approval_mode = "approve"

[mcp_servers.semantic-mcp.tools."sem.health"]
approval_mode = "approve"

[mcp_servers.semantic-mcp.tools."sem.context.top_k"]
approval_mode = "approve"

[mcp_servers.semantic-mcp.tools."sem.capsule"]
approval_mode = "approve"

[mcp_servers.semantic-mcp.tools."sem.search"]
approval_mode = "approve"

[mcp_servers.semantic-mcp.tools."sem.registry.query"]
approval_mode = "approve"

[mcp_servers.semantic-mcp.tools."sem.symbols.search"]
approval_mode = "approve"

# Chrome DevTools MCP — optional per-project opt-in, not in baseline release.
# [mcp_servers.chrome_devtools]
# command = "npx chrome-devtools-mcp@<pin>"

[features]
multi_agent = true

[agents.coder]
description = "実装担当。設計に基づいてコード変更と検証を行う。"
config_file = "agents/coder.toml"

[agents.system_planner]
description = "システム設計プランナー。要件整理と実装計画を作成する。"
config_file = "agents/system_planner.toml"

[agents.plan_reviewer]
description = "プランレビュワー。計画の抜け漏れと実行可能性を検証する。"
config_file = "agents/plan_reviewer.toml"

[agents.security_reviewer]
description = "セキュリティレビュワー。脆弱性と攻撃面を重点レビューする。"
config_file = "agents/security_reviewer.toml"

[agents.performance_reviewer]
description = "パフォーマンスレビュワー。速度・負荷・スケーラビリティを評価する。"
config_file = "agents/performance_reviewer.toml"

[agents.consistency_reviewer]
description = "整合性レビュワー。仕様・設計・実装・テスト間の一貫性を検証する。"
config_file = "agents/consistency_reviewer.toml"

[agents.alternative_reviewer]
description = "代替案レビュワー。より良い実装手段を比較して提案する。"
config_file = "agents/alternative_reviewer.toml"

[agents.stack_upgrade_researcher]
description = "技術スタック更新調査。最新安定版へのアップデート方針を調査する。"
config_file = "agents/stack_upgrade_researcher.toml"

[agents.stack_upgrade_reviewer]
description = "技術スタック更新レビュー。更新計画の妥当性とリスクを検証する。"
config_file = "agents/stack_upgrade_reviewer.toml"

[sandbox_workspace_write]
network_access = true
