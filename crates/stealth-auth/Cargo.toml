[package]
name = "stealth-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Encrypted authentication cookie storage for rev_scraping Phase 9."

[[bin]]
name = "rev-auth"
path = "src/bin/rev_auth.rs"

[features]
default = []
passphrase-only = []

[dependencies]
anyhow = { workspace = true }
stealth-core = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
chromiumoxide = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
keyring = { workspace = true }
obscura-bridge = { workspace = true }
publicsuffix = "2"
parking_lot = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util"] }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vpn-rotate = { workspace = true, features = ["docker"] }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "aead_hotpath"
harness = false

[lints]
workspace = true
