[package]
name = "stealth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "rev-stealth CLI front-end (captcha / browser / vpn subcommands)"

[[bin]]
name = "rev-stealth"
path = "src/main.rs"

[dependencies]
stealth-core = { workspace = true }
captcha-bypass = { workspace = true }
vpn-rotate = { workspace = true, features = ["docker"] }
mobile-fp = { workspace = true }
obscura-bridge = { workspace = true }
stealth-cf = { workspace = true }
stealth-parse = { workspace = true }
stealth-sites = { workspace = true }
stealth-auth = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
toml = "0.8"
dirs = "5"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tower = "0.5"
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
stealth-auth = { workspace = true }
# v1.1.0 (P13): JSON Schema validation for vpn_rotation_events output.
# v1.1.0 (P17): snapshot tests for CLI --help and config-compat.
jsonschema = { version = "0.17", default-features = false }
insta = { version = "1", features = ["yaml"] }

[lints]
workspace = true
