# SPDX-License-Identifier: MIT
#
# v1.3 Lane H Slice A: the workspace member directory is still `crates/stealth-cli/`
# (avoids churn across ~13 `workspace.dependencies` references) but the published
# crate name is `rev-stealth`. Installation:
#   cargo install --locked rev-stealth
# Binary name on `PATH` after install: `rev-stealth`.
#
# The historical `rev-stealth-cli` publish-wrapper crate has been retired in
# Slice A; see `docs/distribution.md` for the rationale.

[package]
name = "rev-stealth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = true
description = "Stealth scraping CLI for AI agents (rev_scraping v1.2+): captcha bypass, browser fingerprint control, VPN rotation, MCP server, content sanitization."
repository = "https://github.com/sasuketorii/rev_scraping"
homepage = "https://github.com/sasuketorii/rev_scraping"
documentation = "https://sasuketorii.github.io/rev_scraping/"
readme = "README.md"
keywords = ["scraping", "stealth", "mcp", "cdp"]
categories = ["command-line-utilities", "web-programming::http-client"]

[lib]
name = "stealth_cli"
path = "src/lib.rs"

[[bin]]
name = "rev-stealth"
path = "src/main.rs"

[features]
# P10.5: opt-in VPS egress probe. When DISABLED (the default), the
# `egress` module returns a deterministic stub and performs no network
# I/O. When enabled, `rev-stealth measure --enable-egress-probe` issues
# an HTTP HEAD against a configurable endpoint to measure exit IP / TLS
# behavior after a VPS deploy. The runtime `--enable-egress-probe` flag
# is still required (double opt-in).
default = []
vps-egress-probe = []

[dependencies]
stealth-core = { workspace = true }
captcha-bypass = { workspace = true }
vpn-rotate = { workspace = true, features = ["docker"] }
mobile-fp = { workspace = true }
obscura-bridge = { workspace = true }
stealth-cf = { workspace = true }
stealth-parse = { workspace = true }
stealth-sites = { workspace = true }
stealth-auth = { workspace = true }

clap = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
# v1.3 Lane G.8: build-time man page generator driven by the hidden
# `rev-stealth manpages <output-dir>` subcommand. Output is committed to
# `target/man/man1/` and gated by the `manpage-drift` CI job.
clap_mangen = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
toml = "0.8"
serde_yaml = "0.9"
dirs = "5"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { workspace = true }
secrecy = { workspace = true }
# P7.3: structured errors for `rev-stealth hermes`.
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tower = "0.5"
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
stealth-auth = { workspace = true }
# v1.1.0 (P13): JSON Schema validation for vpn_rotation_events output.
# v1.1.0 (P17): snapshot tests for CLI --help and config-compat.
jsonschema = { version = "0.17", default-features = false }
insta = { version = "1", features = ["yaml"] }
# v1.3 Lane G fix-up R2: idempotency invariant property tests
# (`tests/idempotency_invariants.rs`). Workspace pin = 1.x; cases default to
# PROPTEST_CASES=50 inside the test module to keep PR-loop time bounded.
proptest = { workspace = true }

[lints]
workspace = true

# -----------------------------------------------------------------------------
# H.2 — cargo-deb metadata (Debian 12 / Ubuntu 22.04 + 24.04)
# -----------------------------------------------------------------------------
# Build with: `cargo deb -p rev-stealth --no-build`
#   (release.yml runs `cargo build --release --bin rev-stealth` first, then
#    `cargo deb --no-build` to avoid double-compilation across the matrix.)
[package.metadata.deb]
name = "rev-stealth"
maintainer = "Sasuke Torii <security-alert.reproduce897@passmail.com>"
copyright = "2026, Sasuke Torii <security-alert.reproduce897@passmail.com>"
license-file = ["../../LICENSE", "4"]
extended-description = """\
rev-stealth is a stealth web scraping and Model Context Protocol (MCP) \
command-line tool designed for AI agent developers (Claude Code, Cursor, \
Hermes). It provides captcha bypass, browser fingerprint control, VPN \
rotation, content sanitization, and an MCP server in a single binary."""
section = "utils"
priority = "optional"
# Distribution-specific runtime deps are intentionally lean. Chromium is
# *not* a hard dep: see Formula caveats. dpkg `Depends:` uses libc6 only;
# the binary is otherwise statically linked via musl in CI (release.yml).
depends = "libc6 (>= 2.31)"
assets = [
    # [source, target, perms]
    ["../../target/release/rev-stealth", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/rev-stealth/README", "644"],
    ["../../LICENSE", "usr/share/doc/rev-stealth/LICENSE", "644"],
]
# Shell completions + man pages are wired at release time by the
# `cargo xtask manpages` step in release.yml (Lane G G.3 + G.8).

# -----------------------------------------------------------------------------
# H.3 — cargo-generate-rpm metadata (RHEL 9 / Fedora 41)
# -----------------------------------------------------------------------------
# Build with: `cargo generate-rpm -p rev-stealth`
#   (also expects `target/release/rev-stealth` pre-built.)
[package.metadata.generate-rpm]
name = "rev-stealth"
license = "MIT"
summary = "Stealth web scraping & MCP CLI for AI agent developers"
# Lean runtime deps; glibc only.
requires = { glibc = ">= 2.34" }
assets = [
    { source = "../../target/release/rev-stealth", dest = "/usr/bin/rev-stealth", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/rev-stealth/README", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/doc/rev-stealth/LICENSE", mode = "644", doc = true },
]
