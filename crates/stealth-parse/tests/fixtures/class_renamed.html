<!DOCTYPE html>
<html>
<head><title>Shop</title></head>
<body>
  <header>
    <h1 data-stable-id="page.title" class="header__title--v2">Acme Online Shop</h1>
    <nav><a data-stable-id="nav.cart" href="/cart" class="navbar__cart-link">Cart (3)</a></nav>
  </header>
  <main>
    <article class="product-card-v2">
      <h2 data-stable-id="product.name" class="product__name">Widget Pro 2026</h2>
      <span data-stable-id="product.price" class="product__price" data-currency="USD">$199.00</span>
      <p data-stable-id="product.desc" class="product__description">A premium widget for serious professionals.</p>
      <button data-stable-id="product.buy" class="button button--primary" type="button">Buy Now</button>
    </article>
    <aside class="reviews-v2">
      <div data-stable-id="review.rating" class="reviews__rating">4.7 stars</div>
      <div data-stable-id="review.count" class="reviews__count">based on 1,204 reviews</div>
    </aside>
  </main>
  <footer>
    <span data-stable-id="footer.copy" class="footer__copy">(c) 2026 Acme Inc.</span>
  </footer>
</body>
</html>
