<!DOCTYPE html>
<html>
<head><title>Shop</title></head>
<body>
  <header>
    <h1 data-stable-id="page.title" class="hdr-title">Acme Online Shop</h1>
    <nav><a data-stable-id="nav.cart" href="/cart" class="nav-cart">Cart (3)</a></nav>
  </header>
  <main>
    <article class="product-card">
      <h2 data-stable-id="product.name" class="prod-name">Widget Pro 2026</h2>
      <span data-stable-id="product.price" class="prod-price" data-currency="USD">$199.00</span>
      <p data-stable-id="product.desc" class="prod-desc">A premium widget for serious professionals.</p>
      <button data-stable-id="product.buy" class="btn-buy" type="button">Buy Now</button>
    </article>
    <aside class="reviews">
      <div data-stable-id="review.rating" class="rating">4.7 stars</div>
      <div data-stable-id="review.count" class="rev-count">based on 1,204 reviews</div>
    </aside>
  </main>
  <footer>
    <span data-stable-id="footer.copy" class="copy">(c) 2026 Acme Inc.</span>
  </footer>
</body>
</html>
