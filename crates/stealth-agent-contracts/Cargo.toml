[package]
# Lane H Slice B-3: published as `rev-stealth-agent-contracts`; lib alias preserved.
name = "rev-stealth-agent-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "rev-stealth shared cross-crate contract types (error envelope, rate limits, opaque ids) for the stealth-* crates."
publish = true
repository = "https://github.com/sasuketorii/rev_scraping"
homepage = "https://github.com/sasuketorii/rev_scraping"
readme = "../../README.md"
keywords = ["scraping", "stealth", "contracts", "types"]
categories = ["web-programming::http-client", "data-structures"]

[lib]
name = "stealth_agent_contracts"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
proptest = { workspace = true }

[lints]
workspace = true
