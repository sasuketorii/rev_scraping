[package]
# Lane H Slice B-3: flipped to `publish = true` and renamed to
# `rev-stealth-sanitize` for crates.io namespace squat-resistance. The lib
# alias remains `stealth_sanitize` so the workspace `use stealth_sanitize::...`
# import surface is unchanged.
name = "rev-stealth-sanitize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = true
description = "rev-stealth prompt-injection defense sanitizer for the RevHarness MCP surface (L2 envelope + L3 canary + L4 unicode + L5 clamp + L7 meta)."
repository = "https://github.com/sasuketorii/rev_scraping"
homepage = "https://github.com/sasuketorii/rev_scraping"
readme = "../../README.md"
keywords = ["scraping", "stealth", "sanitize", "mcp"]
categories = ["web-programming::http-client", "text-processing"]

[lib]
name = "stealth_sanitize"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
unicode-normalization = "0.1"
aho-corasick = "1"

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "sanitize_hotpath"
harness = false

[lints]
workspace = true
