[package]
# Lane H Slice B-3: published as `rev-stealth-obscura-bridge`; lib alias preserved.
name = "rev-stealth-obscura-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = true
description = "rev-stealth bridge to the vendored obscura browser binary (subprocess + CDP)."
repository = "https://github.com/sasuketorii/rev_scraping"
homepage = "https://github.com/sasuketorii/rev_scraping"
readme = "../../README.md"
keywords = ["scraping", "stealth", "cdp", "chromium"]
categories = ["web-programming::http-client"]

[lib]
name = "obscura_bridge"
path = "src/lib.rs"

[features]
default = []
# TLS ClientHello dump. Implementation gated on Phase 0 SOW (S3 observation
# mechanism). Currently exposes an `unimplemented!()` stub so downstream code
# can compile against the API surface.
tls-dump = []

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
chromiumoxide = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
mobile-fp = { workspace = true }
stealth-core = { workspace = true }
dashmap = "6"

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
