[package]
# Lane H Slice B-3: published as `rev-stealth-vpn-rotate`; lib alias preserved.
name = "rev-stealth-vpn-rotate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = true
description = "rev-stealth VPN IP rotation (Surfshark / Gluetun) with lazy-rotate-on-fail strategy"
repository = "https://github.com/sasuketorii/rev_scraping"
homepage = "https://github.com/sasuketorii/rev_scraping"
readme = "../../README.md"
keywords = ["scraping", "stealth", "vpn", "rotation"]
categories = ["web-programming::http-client", "network-programming"]

[lib]
name = "vpn_rotate"
path = "src/lib.rs"

[features]
default = []
# Wave 3: enable bollard-backed Docker control + reqwest IP lookup.
docker = ["dep:bollard", "dep:reqwest"]

[dependencies]
stealth-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
toml = "0.8"
bollard = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
dashmap = "6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
async-trait = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }

[lints]
workspace = true
